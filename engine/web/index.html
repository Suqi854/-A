<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050608">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="A量化">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>A量化 · 交易终端</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/themes.css">
<script>try{var L=JSON.parse(localStorage.getItem('aq5_look')||'{}')||{},d=document.documentElement;['theme','ui','density','updown'].forEach(function(k){if(L[k])d.dataset[k]=L[k]})}catch(e){}</script>
</head>
<body>
<header id="top">
  <div class="logo"><b>AQ</b><span class="full">A-QUANT TERMINAL</span></div>
  <div class="cmd">
    <label>AQ&gt;</label>
    <input id="cmd" autocomplete="off" spellcheck="false" placeholder="输入代码或名称，回车分析 · F1-F8 切换页面">
    <div class="suggest" id="suggest"></div>
  </div>
  <div class="status">
    <span id="mockTag" class="tag-mock" hidden>模拟行情</span>
    <span id="phase" class="phase">--</span>
    <span class="hide-m muted" id="lastUpd"></span>
    <span class="clock" id="clock">--:--:--</span>
  </div>
</header>
<div id="tape"><div class="inner" id="tapeInner"></div></div>
<nav id="nav">
  <a href="#mon" data-p="mon"><span class="k">F1</span><span class="e">MON</span>监控</a>
  <a href="#pick" data-p="pick"><span class="k">F2</span><span class="e">PICK</span>选股<i class="badge" id="pickBadge" hidden></i></a>
  <a href="#anly" data-p="anly"><span class="k">F3</span><span class="e">WATCH</span>自选</a>
  <a href="#sim" data-p="sim"><span class="k">F4</span><span class="e">SIM</span>模拟盘</a>
  <a href="#learn" data-p="learn"><span class="k">F5</span><span class="e">LEARN</span>迭代</a>
  <a href="#bt" data-p="bt"><span class="k">F6</span><span class="e">BT</span>回测</a>
  <a href="#log" data-p="log"><span class="k">F7</span><span class="e">LOG</span>日志</a>
  <a href="#set" data-p="set"><span class="k">F8</span><span class="e">SET</span>设置</a>
</nav>
<main id="main">
  <section class="page" id="p-mon"></section>
  <section class="page" id="p-pick"></section>
  <section class="page" id="p-anly"></section>
  <section class="page" id="p-sim"></section>
  <section class="page" id="p-learn"></section>
  <section class="page" id="p-bt"></section>
  <section class="page" id="p-log"></section>
  <section class="page" id="p-set"></section>
  <div class="disclaimer">本工具用于个人学习与模拟研究。所有评分、信号与交易计划均为模型输出，不构成投资建议；历史与模拟结果不代表未来收益。</div>
</main>
<script src="js/charts.js"></script>
<script src="js/lite.js"></script>
<script src="js/app.js"></script>
</body>
</html>
