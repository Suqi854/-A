name: 云端个股分析原版分段计时
on:
  push:
    branches: ['fix/forecast-perf-profile-20261117']
    paths: ['.github/workflows/aq5-forecast-checks.yml', 'engine/profile_original.py']
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 用公开行情计时中天科技原版分析
        working-directory: engine
        env:
          AQ5_DATA: ${{ runner.temp }}/aq5-profile-public
          AQ5_FORECAST_REQUEST: '1'
          AQ5_CLOUD: '1'
          AQ5_MOCK: '0'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUNBUFFERED: '1'
        run: python -B profile_original.py
