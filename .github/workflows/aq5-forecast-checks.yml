name: 预测闭环工程验收
on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/forecast-*']
    paths: ['engine/aq5/forecast/**', 'engine/tests/test_forecast*', 'engine/requirements-forecast.txt', '.github/workflows/aq5-forecast-checks.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      AQ5_MOCK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 隔离测试目录
        run: |
          mkdir -p "$RUNNER_TEMP/forecast-test"
          echo "AQ5_DATA=$RUNNER_TEMP/forecast-test" >> "$GITHUB_ENV"
          echo "AQ5_TEST_DATA=$RUNNER_TEMP/forecast-test" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/forecast-test" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=$RUNNER_TEMP/pip-cache" >> "$GITHUB_ENV"
      - name: 固定训练依赖
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: -r engine/requirements-forecast.txt
      - name: 结构、预测、模拟、评估与集成
        run: |
          for test in engine/tests/test_forecast*.py; do python -B "$test"; done
          python -B engine/tests/test_execution_guards.py
          python -B engine/tests/test_handoff.py
          python -B engine/tests/test_release_integration.py
          node --check engine/web/js/forecast.js
      - name: 单股票公开行情实际读取（缺口保留）
        working-directory: engine
        env:
          AQ5_MOCK: '0'
        run: python -B -m aq5.forecast.diagnostics --output "$RUNNER_TEMP/forecast-public-report.json"
      - name: 保存公开诊断证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-public-diagnostics
          path: ${{ runner.temp }}/forecast-public-report.json
          if-no-files-found: warn
          retention-days: 7
