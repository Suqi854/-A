name: A量化 云端代跑

# 交易日 08:30-16:00 云端全程值守：电脑开着时只待命（每分钟看一次，不交易）；
# 电脑连续 3 分钟连不上，云端导入最新状态接手：自动选股、AI 自动盘、计划模拟、自选信号、发布网页；
# 电脑回来后存好状态交还。单次运行快到 6 小时上限时会自己接力下一次（workflow_dispatch）。
# GitHub 的定时触发经常延迟或跳过，所以早上放了多个错开的触发点，全天也有补位触发：
# 只要有一个触发成功，当天就有人值守；其余的会排队，轮到时发现已过时段或直接继续值守。
# 需要在仓库 Settings → Secrets and variables → Actions 添加：
#   AQ5_KEY     = 「手机查看密码」（用来解密/加密 state 分支里的状态）
#   AQ5_AI_KEY  = （可选）DeepSeek 等 AI 接口 Key，用于云端 AI 复盘/简报

on:
  schedule:
    - cron: "7,19,31,43,57 0 * * 1-5"   # 北京时间 08:07 / 08:19 / 08:31 / 08:43 / 08:57（避开整点、刻钟的拥堵）
    - cron: "9,21,47 1 * * 1-5"         # 北京时间 09:09 / 09:21 / 09:47
    - cron: "13,33,53 2-7 * * 1-5"      # 北京时间 10:13-15:53 每 20 分钟补位（值守中断时重新接上）
  workflow_dispatch:
    inputs:
      mode:
        description: "run = 正常代跑；diag = 只测试行情源"
        default: diag
        type: choice
        options: [diag, run]

permissions:
  contents: write
  actions: write   # 值守接力：触发下一次 workflow_dispatch

concurrency:
  group: aq5-cloud
  cancel-in-progress: false

jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Git 身份
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "aq5-cloud"
          git config --global user.email "aq5-cloud@users.noreply.github.com"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
      - name: 代跑
        working-directory: engine
        env:
          AQ5_CLOUD: "1"
          AQ5_DATA: ${{ runner.temp }}/aq5
          AQ5_KEY: ${{ secrets.AQ5_KEY }}
          AQ5_AI_KEY: ${{ secrets.AQ5_AI_KEY }}
          AQ5_RELAY: ${{ vars.AQ5_RELAY || 'https://aq5-relay.phehwm62784.workers.dev' }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ inputs.mode }}" = "diag" ]; then python -m aq5.cloud diag; exit 0; fi
          if [ -z "$AQ5_KEY" ]; then echo "还没有设置 Secret AQ5_KEY（手机查看密码），跳过"; exit 0; fi
          python -m aq5.cloud
