name: AQ5 Chrome endpoint comparison
on:
  push:
    branches: [codex/aq5-release-check-20261112]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Measure both public URLs in fresh Chrome contexts
        env:
          NODE_PATH: ${{ runner.temp }}/aq5-browser/node_modules
        run: |
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/aq5-browser" playwright@1.56.1
          node .github/aq5-release-check.cjs
